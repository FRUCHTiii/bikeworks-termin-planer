line-length = 100
target-version = "py312"

[lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # warnings
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long - ruff format kuemmert sich darum
    "B008",   # function call in default arg - ok fuer dataclass field()
]

[lint.per-file-ignores]
"tests/*" = ["E402"]  # imports nach sys.path-Hack ok in tests

[format]
quote-style = "double"
indent-style = "space"
